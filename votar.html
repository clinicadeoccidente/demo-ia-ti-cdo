<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tu voto · AI Experience 2026</title><style>*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top right,#204477,#071329 60%);color:#fff;min-height:100dvh;margin:0;display:grid;place-items:center;padding:20px}main{max-width:520px;width:100%;background:#10244a;border:1px solid #385b88;border-radius:24px;padding:30px}small{color:#ffac45;letter-spacing:.1em;font-weight:700}h1{font-size:clamp(30px,6vw,45px);line-height:1.1}p{color:#c4d5eb}button{display:block;width:100%;text-align:left;padding:20px;margin:12px 0;border-radius:14px;background:#1b3664;color:white;border:1px solid #54749f;font-size:19px;cursor:pointer}button:hover{border-color:#ffac45}button:disabled{opacity:.5}#message{min-height:24px;color:#ffc27c}</style></head><body><main><small>CLÍNICA DE OCCIDENTE · AI EXPERIENCE 2026</small><h1>¿Dónde debería avanzar primero la IA?</h1><p>Elige una opción. Se permite un voto por dispositivo durante esta sesión.</p><div id="choices"><button data-v="0">Historia clínica inteligente</button><button data-v="1">Experiencia del paciente</button><button data-v="2">Operación hospitalaria</button></div><p id="message" role="status"></p><p style="font-size:13px">No ingreses datos personales ni información de pacientes.</p></main><script type="module">import {connect,castVote} from './firebase-votacion.js';const msg=document.getElementById('message');let ready=false,open=false,voted=false;const buttons=[...document.querySelectorAll('button[data-v]')];const opts=['historia_clinica','experiencia_paciente','operacion_hospitalaria'];function refresh(){buttons.forEach(b=>b.disabled=!ready||!open||voted)}refresh();connect({onUser:()=>{ready=true;refresh()},onPoll:p=>{open=p?.abierta===true;if(!open)msg.textContent='La votación está cerrada.';refresh()},onError:e=>{msg.textContent='Error: '+e}});buttons.forEach(b=>b.onclick=async()=>{if(!ready||!open||voted)return;buttons.forEach(x=>x.disabled=true);try{await castVote(opts[Number(b.dataset.v)]);voted=true;msg.textContent='¡Gracias! Tu voto fue registrado.'}catch(e){msg.textContent=e.code==='permission-denied'?'Ya votaste o la votación está cerrada.':('No se pudo votar: '+e.message)}refresh()});</script></body></html>
