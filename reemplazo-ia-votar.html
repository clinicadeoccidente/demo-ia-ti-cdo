<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encuesta IA · AI Experience 2026</title><style>*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top right,#174a72,#071329 65%);color:#fff;min-height:100dvh;margin:0;display:grid;place-items:center;padding:18px}main{max-width:620px;width:100%;background:#102442;border:1px solid #356788;border-radius:23px;padding:clamp(18px,5vw,32px)}small{color:#76eaff;letter-spacing:.1em;font-weight:700}h1{font-size:clamp(27px,6vw,42px);line-height:1.1}p{color:#c4d5eb}button{display:block;width:100%;text-align:left;padding:16px;margin:10px 0;border-radius:13px;background:#1a3658;color:white;border:1px solid #54749f;font-size:clamp(15px,3.5vw,19px);cursor:pointer}button:hover{border-color:#76eaff}button:disabled{opacity:.55;cursor:default}#message{min-height:24px;color:#ffc27c}</style></head><body><main><small>CLÍNICA DE OCCIDENTE · AI EXPERIENCE 2026</small><h1>¿La inteligencia artificial reemplazará al personal asistencial?</h1><p>Elige una respuesta. Cada sesión puede votar una vez.</p><div id="choices"><button data-v="0"><b>A</b> · Sí, pronto tendremos al Dr. ChatGPT pasando revista 🤖</button><button data-v="1"><b>B</b> · No, una IA jamás tendrá la paciencia de enfermería 💙</button><button data-v="2"><b>C</b> · Solo si aprende a hacer turnos de 12 horas sin quejarse ☕</button><button data-v="3"><b>D</b> · No nos reemplazará, pero quien sepa usarla tendrá ventaja 🚀</button><button data-v="4"><b>E</b> · Sí, nos reemplazará.</button></div><p id="message" role="status">Conectando con la encuesta…</p><p style="font-size:13px">No ingreses datos personales ni información de pacientes.</p></main><script type="module">import {connect,castVote} from './firebase-votacion.js';const msg=document.getElementById('message');let ready=false,open=false,voted=false;const buttons=[...document.querySelectorAll('button[data-v]')];const opts=["dr_chatgpt", "paciencia_enfermeria", "turnos_12_horas", "ventaja_ia", "si_reemplazara"];function refresh(){buttons.forEach(b=>b.disabled=!ready||!open||voted)}refresh();connect({id:'reemplazoia2026',onUser:()=>{ready=true;refresh()},onPoll:p=>{open=p?.abierta===true;msg.textContent=open?'Selecciona tu respuesta':'La votación está cerrada';refresh()},onError:e=>msg.textContent='Error: '+e});buttons.forEach(b=>b.onclick=async()=>{if(!ready||!open||voted)return;buttons.forEach(x=>x.disabled=true);try{await castVote(opts[Number(b.dataset.v)],'reemplazoia2026');voted=true;msg.textContent='¡Gracias! Tu voto fue registrado.'}catch(e){msg.textContent=e.code==='permission-denied'?'Ya votaste o la encuesta está cerrada.':'No se pudo votar: '+e.message}refresh()});</script></body></html>
